services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow_server
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
      - ./mlartifacts:/mlartifacts
    command: >
      mlflow server
      --backend-store-uri sqlite:///mlruns/mlflow.db
      --artifacts-destination /mlartifacts
      --host 0.0.0.0
      --port 5000
